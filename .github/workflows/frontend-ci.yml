name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'mad_sessionops_frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mad_sessionops_frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: mad_sessionops_frontend

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mad_sessionops_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (strict, informational — see Open Questions in ci-cd-pipeline-tasks.md)
        run: npm run lint:strict
        continue-on-error: true

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mad_sessionops_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./mad_sessionops_frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_NAME: Session-Ops
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
      NEXT_PUBLIC_ENABLE_DEBUG: "false"
      NEXT_PUBLIC_ENABLE_MOCK_API: "false"
      NEXT_PUBLIC_LOG_LEVEL: error
      NEXT_PUBLIC_API_TIMEOUT: "30000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mad_sessionops_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
