# Production nginx site — placeholder phase (no domain yet).
#
# Status as of 2026-09-04: waiting on the production domain to be released
# from Bubble. Until then, this serves the maintenance page (ops/maintenance/
# index.html) on its own port, on the same EC2 host as staging — staging
# already owns :80/:443 via server_name-based routing (dev.sessionops...),
# so this can't share those ports without a domain of its own to route on.
#
# Deploy on the EC2 host:
#   sudo cp ops/nginx/production.sessionops.conf /etc/nginx/sites-available/sessionops-production
#   sudo ln -s /etc/nginx/sites-available/sessionops-production /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/sessionops-production-maintenance
#   sudo cp ops/maintenance/index.html /var/www/sessionops-production-maintenance/
#   sudo nginx -t && sudo systemctl reload nginx
#   curl http://<EC2-PUBLIC-IP>:8081/
#
# Also open the port in the EC2 security group's inbound rules (8081/tcp),
# or nginx will be listening but unreachable from outside the box.
#
# ── Tomorrow, once the domain is released ────────────────────────────────
# 1. Set `server_name` below to the real domain (leave `listen 8081;` as-is
#    for now, or change to 80 once ready to go fully live).
# 2. Run: sudo certbot --nginx -d <the-domain>
#    Certbot rewrites this file in place — adds `listen 443 ssl;` +
#    cert paths, and a second server{} block redirecting :80 -> :443,
#    exactly like dev.sessionops.makeadiff.in already has.
# 3. Once the real backend/frontend containers are up on their own host
#    ports (this same EC2 box already has 8000/3000 taken by staging — pick
#    different ones, e.g. 8001/3001, for the production docker-compose
#    override), swap the `location /` block below for the same
#    proxy_pass-to-frontend + /api + /django-admin + /static structure
#    dev.sessionops.makeadiff.in uses, pointed at the new upstream ports.
#    Until that swap happens, every request just serves the maintenance page.

server {
    listen 8081;
    server_name _;

    location / {
        root /var/www/sessionops-production-maintenance;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
