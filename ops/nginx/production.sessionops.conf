# Production nginx site — sessionops.makeadiff.in — public, live for all users.
#
# Went live 2026-09-04. Was soft-launched behind a `geo`-based IP allowlist
# (see git history on this file for that version) — removed once the team
# had verified the full deployed stack end-to-end. The @maintenance location
# below is kept in place, unused, so a future maintenance window can be
# re-enabled quickly: add `if (<condition>) { return 503; }` to any location
# block and it'll route to ops/maintenance/index.html automatically.
#
# Same host as staging (dev.sessionops.makeadiff.in, both resolve to
# 15.206.172.255) — proxies to the production containers from
# docker-compose.production.yml: backend on :9000, frontend on :5000.
#
# ── Deploy / update on EC2 ───────────────────────────────────────────────
#   sudo cp ops/nginx/production.sessionops.conf /etc/nginx/sites-available/sessionops-production
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: the `listen 443 ssl` block, its cert paths, and the :80 -> :443
# redirect server block below are managed by Certbot (added via
# `sudo certbot --nginx -d sessionops.makeadiff.in`) — don't hand-edit those
# lines; if the cert ever needs reissuing, Certbot rewrites them in place
# and this file should be re-synced from the live server afterward.

upstream sessionops_production_backend {
    server 127.0.0.1:9000;
}

upstream sessionops_production_frontend {
    server 127.0.0.1:5000;
}

server {
    server_name sessionops.makeadiff.in;

    client_max_body_size 20M;

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/sessionops-production-maintenance;
        try_files /index.html =404;
    }

    # Django admin
    location /django-admin/ {
        proxy_pass http://sessionops_production_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://sessionops_production_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend healthcheck (unauthenticated, root path per sessionops/urls.py)
    location = /healthcheck {
        proxy_pass http://sessionops_production_backend;
        proxy_set_header Host $host;
    }

    # Static files — served directly by nginx from the Docker named volume,
    # not proxied through gunicorn (no whitenoise in MIDDLEWARE).
    # Replace the alias path with the output of:
    #   docker volume inspect sessionops-production_staticfiles --format '{{ .Mountpoint }}'
    location /static/ {
        alias /var/lib/docker/volumes/sessionops-production_staticfiles/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else -> Next.js frontend
    location / {
        proxy_pass http://sessionops_production_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sessionops.makeadiff.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sessionops.makeadiff.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = sessionops.makeadiff.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sessionops.makeadiff.in;
    return 404; # managed by Certbot


}
