# Production nginx site — sessionops.makeadiff.in, soft-launch behind an
# IP allowlist (real app for allowlisted IPs, maintenance page for everyone
# else) until go-live is decided.
#
# Same host as staging (dev.sessionops.makeadiff.in, both resolve to
# 15.206.172.255) — proxies to the production containers from
# docker-compose.production.yml: backend on :9000, frontend on :5000.
#
# ── Sequencing ───────────────────────────────────────────────────────────
# 1. DigitalOcean A record: sessionops.makeadiff.in -> 15.206.172.255
#    (added alongside the existing dev.sessionops.makeadiff.in record).
# 2. Deploy this file (HTTP only, no `listen 443 ssl` block yet — nginx
#    refuses to start if it references cert files that don't exist, and
#    there's no cert until step 4).
# 3. Wait for DNS to propagate: `dig +short sessionops.makeadiff.in` must
#    return 15.206.172.255 before Certbot's HTTP-01 challenge can succeed.
# 4. sudo certbot --nginx -d sessionops.makeadiff.in
#    Rewrites this file in place: adds `listen 443 ssl;` + cert paths to
#    the block below, and appends the standard :80 -> :443 redirect block
#    — exactly what already happened for dev.sessionops.makeadiff.in
#    (compare its "# managed by Certbot" lines).
#
# ── IP allowlist ─────────────────────────────────────────────────────────
# Add/remove IPs in the `geo` block below as who needs early access changes.
# After editing: `sudo nginx -t && sudo systemctl reload nginx` (no restart,
# zero downtime for anyone already being served). Keep this file and the
# deployed /etc/nginx/sites-available/sessionops-production copy in sync —
# update both, commit this one.
#
# /healthcheck and /static/ are deliberately NOT gated — neither exposes
# anything sensitive, and gating the healthcheck would break monitoring.
#
# ── Deploy / update on EC2 ───────────────────────────────────────────────
#   sudo cp ops/nginx/production.sessionops.conf /etc/nginx/sites-available/sessionops-production
#   sudo ln -sf /etc/nginx/sites-available/sessionops-production /etc/nginx/sites-enabled/
#   docker volume inspect sessionops-production_staticfiles --format '{{ .Mountpoint }}'
#   # ^ paste that path into the `alias` line below before reloading
#   sudo nginx -t && sudo systemctl reload nginx

geo $sessionops_allowed {
    default 0;
    # ISP appears to be CGNAT (public IP rotates) — multiple recent IPs kept
    # here as a stopgap. Update as it keeps changing; this is a soft-launch
    # measure only, not meant to be maintained long-term.
    152.58.25.102/32 1;
    152.59.48.211/32 1;
    45.251.33.22/32 1;
    152.59.47.142/32 1;   # team — add more lines here as needed
}

upstream sessionops_production_backend {
    server 127.0.0.1:9000;
}

upstream sessionops_production_frontend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name sessionops.makeadiff.in;

    client_max_body_size 20M;

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/sessionops-production-maintenance;
        try_files /index.html =404;
    }

    # Django admin — gated
    location /django-admin/ {
        if ($sessionops_allowed = 0) { return 503; }
        proxy_pass http://sessionops_production_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — gated
    location /api/ {
        if ($sessionops_allowed = 0) { return 503; }
        proxy_pass http://sessionops_production_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend healthcheck (unauthenticated, root path per sessionops/urls.py)
    # — left open for infra monitoring, not gated.
    location = /healthcheck {
        proxy_pass http://sessionops_production_backend;
        proxy_set_header Host $host;
    }

    # Static files — served directly by nginx from the Docker named volume,
    # not proxied through gunicorn (no whitenoise in MIDDLEWARE). Not gated
    # — no sensitive data, just CSS/JS/admin assets.
    # Replace the alias path with the output of:
    #   docker volume inspect sessionops-production_staticfiles --format '{{ .Mountpoint }}'
    location /static/ {
        alias /var/lib/docker/volumes/sessionops-production_staticfiles/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else -> Next.js frontend — gated
    location / {
        if ($sessionops_allowed = 0) { return 503; }
        proxy_pass http://sessionops_production_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
