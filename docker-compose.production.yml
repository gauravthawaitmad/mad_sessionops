# Production overrides — same EC2 host as staging.
#
# `name:` below pins this project to a distinct Compose project name
# ("sessionops-production" vs. the base file's "sessionops"). Without this,
# `docker compose -f docker-compose.yml -f docker-compose.production.yml up`
# would be treated as THE SAME project staging already runs on this box —
# risking Compose renaming/replacing/colliding with staging's live containers.
# Because this file is always the LAST -f argument in the command below, its
# `name:` wins the merge and applies automatically (no need to remember a
# manual `-p` flag on every invocation).
name: sessionops-production
#
# Deploy this from its OWN separate git checkout, not staging's directory —
# e.g. /opt/sessionops/production_sessionops/ alongside the existing
# /opt/sessionops/staging_sessionops/. That way a plain `.env` in this
# checkout's root can't collide with staging's `.env`: they're different
# files on disk, so there's no risk of "whoever edited it last wins" across
# environments. In that separate checkout's root .env, set:
#   BACKEND_ENV_FILE=./mad_sessionops_backend/.env.production
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID=<real value>
#   NEXT_PUBLIC_SENTRY_DSN=<the DSN already sitting in mad_sessionops_frontend/.env.production —
#     that file is dead for the Docker build itself (see its Dockerfile's own comment:
#     NEXT_PUBLIC_* must come in as build args, not a runtime env file), but the DSN it
#     holds is a real, already-provisioned production Sentry project — reuse it here.
#   SENTRY_ORG=...           # optional, source-map upload only
#   SENTRY_PROJECT=...       # optional, source-map upload only
#   SENTRY_AUTH_TOKEN=...    # optional, source-map upload only
#
# Usage (on EC2, from that separate checkout — same pattern as staging, no
# --env-file needed since Compose already defaults to ./.env):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Ports use `!override` (Compose Specification merge tag, needs Compose
# v2.24+ — check with `docker compose version` first) rather than a plain
# `ports:` list: Compose's default merge behavior for `ports` (like `volumes`,
# `expose`) is to CONCATENATE across files, not replace. Without !override,
# the merged config would carry BOTH the base file's 8000:8000/3000:3000 AND
# this file's 9000:8000/5000:3000 on the same container — and since 8000 is
# already bound by staging, the container would fail to start. If the
# installed Compose predates v2.24, this needs restructuring instead (moving
# ports out of the shared base file into each environment's own override) —
# don't fall back to a plain `ports:` list here, it silently reintroduces
# the exact collision this is meant to prevent.
#
# Verify before every first `up` on this box regardless: run the same command
# with `config` instead of `up -d --build` and confirm the printed, fully
# merged config shows ONLY 9000:8000 / 5000:3000 for backend/frontend (not
# those AND the base file's 8000/3000):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml config

services:

  backend:
    ports: !override
      - "9000:8000"

  frontend:
    ports: !override
      - "5000:3000"
    build:
      args:
        # Placeholder until the production domain is released (see
        # ops/nginx/production.sessionops.conf) — update alongside it and
        # the backend's ALLOWED_HOSTS/CORS_ALLOWED_ORIGINS/FRONTEND_URL* when
        # the domain lands, then rebuild. Assumes testing hits the backend
        # container directly on :9000 rather than through nginx for now —
        # if you'd rather route /api through the nginx placeholder instead,
        # say so and this (and the nginx config) need to change together.
        NEXT_PUBLIC_API_URL: http://<EC2-PUBLIC-IP>:9000/api
        NEXT_PUBLIC_APP_URL: http://<EC2-PUBLIC-IP>:5000
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
        NEXT_PUBLIC_ENABLE_DEBUG: "false"
        NEXT_PUBLIC_ENABLE_MOCK_API: "false"
        NEXT_PUBLIC_LOG_LEVEL: error
        NEXT_PUBLIC_API_TIMEOUT: "30000"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      secrets:
        - sentry_auth_token
