name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Run Black
      run: |
        source .venv/bin/activate
        black --check sessionops/
        
    - name: Run isort
      run: |
        source .venv/bin/activate
        isort --check-only sessionops/
        
    - name: Run Pylint
      run: |
        source .venv/bin/activate
        pylint sessionops/ || true
      continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync

    - name: Create .env.test file
      run: |
        cat > .env.test << EOF
        DJANGOSECRET=test-secret-key-for-ci
        DEBUG=True
        ENVIRONMENT=test
        DBNAME=test_db
        DBHOST=localhost
        DBPORT=5432
        DBUSER=postgres
        DBPASSWORD=postgres
        JWT_SECRET_KEY=test-jwt-secret
        FRONTEND_URL=http://localhost:3000
        CELERY_BROKER_URL=redis://localhost:6379/0
        CELERY_RESULT_BACKEND=redis://localhost:6379/0
        EOF

    - name: Create logs directory
      run: mkdir -p sessionops/logs

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest --cov=sessionops --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Run Bandit security scan
      run: |
        source .venv/bin/activate
        pip install bandit
        bandit -r sessionops/ -f json -o bandit-report.json || true
      continue-on-error: true
      
    - name: Run Safety check
      run: |
        source .venv/bin/activate
        pip install safety
        safety check || true
      continue-on-error: true


