name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Check code complexity
      run: |
        source .venv/bin/activate
        pip install radon
        radon cc sessionops/ -a -nb
      continue-on-error: true
      
    - name: Check maintainability index
      run: |
        source .venv/bin/activate
        radon mi sessionops/ -nb
      continue-on-error: true
      
    - name: Check for code duplication
      run: |
        source .venv/bin/activate
        pip install pylint
        pylint --disable=all --enable=duplicate-code sessionops/ || true
      continue-on-error: true
      
    - name: Check docstring coverage
      run: |
        source .venv/bin/activate
        pip install interrogate
        interrogate -v sessionops/
      continue-on-error: true
      
    - name: Check type hints
      run: |
        source .venv/bin/activate
        pip install mypy django-stubs djangorestframework-stubs
        mypy sessionops/ --ignore-missing-imports || true
      continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4

