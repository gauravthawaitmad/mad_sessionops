repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '100']

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=200', '--extend-ignore=E203,W503']

  - repo: local
    hooks:
      - id: check-migration-db-alias
        name: Migration DB-alias check
        description: RunPython migrations must pin .using(schema_editor.connection.alias)
        entry: python scripts/check_migration_db_alias.py
        language: system
        pass_filenames: false
        files: ^sessionops/migrations/.*\.py$

default_language_version:
  python: python3.10

