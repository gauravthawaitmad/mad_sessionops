repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # docker-compose.production.yml uses the Compose Specification's
        # `!override` merge tag on its `ports:` keys (needed so they REPLACE
        # rather than concatenate with docker-compose.yml's own ports: when
        # merged — Compose's default list-merge behavior would otherwise
        # carry staging's 8000/3000 through alongside production's 9000/5000
        # and fail to bind). `!override` is a Compose-specific YAML extension,
        # not valid generic YAML, so check-yaml's plain PyYAML loader can't
        # parse it even though `docker compose config` parses and merges it
        # correctly (verified locally 2026-09-04). Excluded here rather than
        # dropping the tag — see docker-compose.production.yml's own header
        # comment for the full reasoning.
        exclude: ^docker-compose\.production\.yml$
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '100']

  - repo: local
    hooks:
      # IMPORTANT: pre-commit always runs `entry` commands, and matches
      # `files:` patterns, relative to the git repository ROOT
      # (C:\MAD_WORKSPACE\mad_sessionops) — never relative to this config
      # file's own directory (mad_sessionops_backend/), even when invoked via
      # `cd mad_sessionops_backend && pre-commit run` (confirmed empirically
      # 2026-07-29: a hook that just runs `pwd` prints the repo root). Every
      # local hook below must therefore `cd mad_sessionops_backend` inside its
      # own entry, and every `files:` pattern must include that prefix.
      #
      # check-migration-db-alias had neither of those before this fix — its
      # `entry: python scripts/check_migration_db_alias.py` and
      # `files: ^sessionops/migrations/.*\.py$` both silently assumed cwd was
      # already mad_sessionops_backend/. Since that's never true when pre-commit
      # actually runs it, the pattern never matched any real staged path
      # (which is always `mad_sessionops_backend/sessionops/migrations/...`),
      # so this safety check has been a permanent no-op locally — it only ever
      # ran for real in CI (backend-ci.yml sets
      # `defaults.run.working-directory: mad_sessionops_backend` for every step).
      - id: check-migration-db-alias
        name: Migration DB-alias check
        description: RunPython migrations must pin .using(schema_editor.connection.alias)
        entry: bash -c 'cd mad_sessionops_backend && python scripts/check_migration_db_alias.py'
        language: system
        pass_filenames: false
        files: ^mad_sessionops_backend/sessionops/migrations/.*\.py$

      # flake8/mypy/pylint/bandit run via `uv run` (language: system) rather
      # than pre-commit's own mirrored hook repos, so they use the exact same
      # pinned versions from pyproject.toml/uv.lock that backend-ci.yml's
      # `lint` job runs — no drift between what passes locally and what CI
      # checks. Added 2026-07-29 after a mypy-only failure passed every local
      # hook and only surfaced after push; these three were CI-only before.
      #
      # flake8 was converted from a mirrored repo hook to this local pattern
      # on 2026-08-21: the mirrored hook ran from the repo root and never
      # discovered mad_sessionops_backend/.flake8 (config discovery only
      # walks up from cwd, never down into subdirectories) — so its
      # deliberate ignore list (E221/E222/E231/E241/E266/E402/F401/E702/E713,
      # all documented false positives from f-string content and aligned
      # model-field declarations) was silently never applied, and flake8's
      # bare defaults + the hook's own `--extend-ignore=E203,W503` ran
      # instead. Same root cause as the mypy/pylint/bandit fix above.
      - id: flake8
        name: flake8
        entry: bash -c 'cd mad_sessionops_backend && uv run flake8 sessionops/'
        language: system
        pass_filenames: false
        files: ^mad_sessionops_backend/sessionops/.*\.py$

      - id: mypy
        name: mypy
        entry: bash -c 'cd mad_sessionops_backend && uv run mypy sessionops/'
        language: system
        pass_filenames: false
        files: ^mad_sessionops_backend/sessionops/.*\.py$

      - id: pylint
        name: pylint
        # PYTHONIOENCODING=utf-8: pylint's colored/box-drawing output crashes
        # Python's default Windows console encoding (cp1252) with
        # UnicodeEncodeError. CI runs on Ubuntu (UTF-8 by default) so this
        # only ever surfaced locally on Windows.
        entry: bash -c 'cd mad_sessionops_backend && PYTHONIOENCODING=utf-8 uv run pylint sessionops/'
        language: system
        pass_filenames: false
        files: ^mad_sessionops_backend/sessionops/.*\.py$

      - id: bandit
        name: bandit
        entry: bash -c 'cd mad_sessionops_backend && uv run bandit -r sessionops/ -c .bandit'
        language: system
        pass_filenames: false
        files: ^mad_sessionops_backend/sessionops/.*\.py$

default_language_version:
  python: python3.12
