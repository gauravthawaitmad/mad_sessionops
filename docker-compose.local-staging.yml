# Local Docker test with staging credentials (RDS, Brevo, Google OAuth).
# Set BACKEND_ENV_FILE in the root .env file before running:
#   echo "BACKEND_ENV_FILE=./mad_sessionops_backend/.env.staging" >> .env
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local-staging.yml up --build

services:

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_APP_ENV: staging
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "665756451396-rgnaukah8oid76hfvdfct7m8dokmsjjd.apps.googleusercontent.com"
        NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
        NEXT_PUBLIC_ENABLE_DEBUG: "true"
        NEXT_PUBLIC_ENABLE_MOCK_API: "false"
        NEXT_PUBLIC_LOG_LEVEL: info
        NEXT_PUBLIC_API_TIMEOUT: "30000"
